<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Make it useful. Make it clear. Make it hold up.</title>
  <desc id="desc">A closing statement for Sai Siddharth's profile.</desc>
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0c1019"/><stop offset=".5" stop-color="#121a2a"/><stop offset="1" stop-color="#0b1719"/></linearGradient>
    <linearGradient id="f-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c6cff"/><stop offset=".5" stop-color="#44c7ff"/><stop offset="1" stop-color="#45e6b0"/></linearGradient>
  </defs>
  <rect width="1200" height="150" rx="22" fill="url(#f-bg)"/>
  <rect x="72" y="38" width="1056" height="2" rx="1" fill="url(#f-line)" opacity=".76"/>
  <text x="600" y="96" text-anchor="middle" fill="#dce8f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="610" letter-spacing=".3">Make it useful.  Make it clear.  Make it hold up.</text>
  <text x="600" y="122" text-anchor="middle" fill="#6f8297" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">SAI SIDDHARTH  /  BUILDING IN PUBLIC</text>
  <rect x=".5" y=".5" width="1199" height="149" rx="21.5" fill="none" stroke="#7994ae" stroke-opacity=".18"/>
</svg>
